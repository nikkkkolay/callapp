<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Контакт-центр</title>
        <script>
            var segmentCount = 1; // /callapp/ → 1
            var l = window.location;
            l.replace(
                l.protocol +
                    "//" +
                    l.hostname +
                    (l.port ? ":" + l.port : "") +
                    l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
                    "/?/" +
                    l.pathname
                        .slice(1)
                        .split("/")
                        .slice(segmentCount)
                        .join("/")
                        .replace(/&/g, "~and~") +
                    (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
                    l.hash,
            );
        </script>
    </head>
    <body></body>
</html>
